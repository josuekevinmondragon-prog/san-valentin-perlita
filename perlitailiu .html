<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Perlita ❤️</title>

<style>
:root {
  --bg: #fff0f5;
  --heart: #e63946;
  --text: #7b2cbf;
}

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle, #ffd6e0, var(--bg));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
  text-align: center;
}

h1 {
  color: var(--text);
  margin-bottom: 8px;
}

p {
  color: #6c3483;
  font-size: 1.2rem;
  max-width: 90%;
}

/* Árbol */
.tree {
  position: relative;
  width: 220px;
  height: 260px;
  margin-top: 10px;
}

.trunk {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 30px;
  height: 90px;
  background: #8d5524;
  transform: translateX(-50%);
  border-radius: 10px;
}

/* Corazones del árbol */
.heart {
  position: absolute;
  width: 18px;
  height: 18px;
  background: var(--heart);
  transform: rotate(45deg);
  animation: pulse 3s infinite ease-in-out;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  background: var(--heart);
  border-radius: 50%;
}

.heart::before {
  top: -9px;
}

.heart::after {
  left: -9px;
}

@keyframes pulse {
  0%,100% { transform: rotate(45deg) scale(1); }
  50% { transform: rotate(45deg) scale(1.25); }
}

/* Gatitos alrededor del árbol */
.cat {
  position: absolute;
  font-size: 26px;
  animation: floatCat 4s infinite ease-in-out;
}

@keyframes floatCat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* Botones */
button {
  margin-top: 14px;
  padding: 12px 22px;
  border: none;
  border-radius: 25px;
  background: #ff4d6d;
  color: white;
  font-size: 1rem;
  cursor: pointer;
}

button:hover {
  background: #e63946;
}

/* Corazones y gatitos cayendo */
.falling {
  position: fixed;
  top: -30px;
  font-size: 22px;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<h1>🌹 Para ti Perlita, amor de mi vida 🌹</h1>

<p>
Te amo mucho, hoy y siempre 💕<br>
Que Diosito nos acompañe siempre ❤️
</p>

<div class="tree">
  <div class="trunk"></div>
</div>

<button onclick="iniciarAmor()">💌 Toca aquí mi amor</button>
<button onclick="aceptar()">💍 ¿Aceptás ser mi San Valentín?</button>

<!-- Música -->
<audio id="musica" loop>
  <source src="https://archive.org/download/leo-dan-tu-llegaste-a-mi-vida/Leo%20Dan%20-%20Tu%20llegaste%20a%20mi%20vida.mp3" type="audio/mpeg">
</audio>

<script>
// Música + mensaje
function iniciarAmor() {
  document.getElementById("musica").play();
  alert(
    "Perlita ❤️\n\n" +
    "Tú llegaste a mi vida cuando menos lo esperaba.\n" +
    "Te amo hoy y siempre.\n\n" +
    "Que Diosito cuide nuestro amor 🙏✨"
  );
}

function aceptar() {
  alert("💖 SÍ 💖\n\nTe amo Perlita, amor de mi vida 🐱🌸");
}

// Corazones del árbol
const tree = document.querySelector('.tree');

for (let i = 0; i < 60; i++) {
  const h = document.createElement('div');
  h.className = 'heart';
  const a = Math.random() * Math.PI * 2;
  const r = Math.random() * 90;
  h.style.left = 110 + Math.cos(a) * r + 'px';
  h.style.top = 90 + Math.sin(a) * r + 'px';
  tree.appendChild(h);
}

// Gatitos con flores alrededor del árbol
const cats = ["🐱🌸","🐱💐","😺🌹","😻🌷"];
for (let i = 0; i < 8; i++) {
  const c = document.createElement('div');
  c.className = 'cat';
  c.textContent = cats[Math.floor(Math.random()*cats.length)];
  c.style.left = Math.random() * 180 + 'px';
  c.style.top = Math.random() * 120 + 'px';
  c.style.animationDelay = Math.random() * 2 + 's';
  tree.appendChild(c);
}

// Corazones + gatitos cayendo
setInterval(() => {
  const f = document.createElement('div');
  f.className = 'falling';
  f.textContent = Math.random() > 0.6 ? "🐱🌸" : "❤️";
  f.style.left = Math.random() * 100 + 'vw';
  f.style.animationDuration = (2 + Math.random() * 3) + 's';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 5000);
}, 300);
</script>

</body>
</html>
